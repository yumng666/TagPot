<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Pot · 相册</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ============ 左侧栏 ============ -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M11 9.6c0-1.5 1.2-2.1 1.2-3.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".72"/>
        <path d="M16 8.9c0-1.9 1.4-2.6 1.4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".72"/>
        <path d="M21 9.6c0-1.5 1.2-2.1 1.2-3.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".72"/>
        <path d="M5.6 14.2h20.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M7.6 14.2v6.1a8.4 8.4 0 0 0 16.8 0v-6.1" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M3.6 16.1h1.9M26.5 16.1h1.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".85"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>Tag Pot</h1>
      <span>local gallery</span>
    </div>
  </div>

  <div class="add-wrap" id="addWrap">
    <button class="add-btn" id="addBtn" type="button">
      <span class="plus">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 3.2v9.6M3.2 8h9.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="add-label">添加文件夹</span>
    </button>
  </div>

  <nav class="menu" id="menu">
    <div class="sel" id="sel"></div>
  </nav>

</aside>

<!-- ============ 右侧舞台 ============ -->
<main class="stage" id="stage">
  <header class="stage-head">
    <div class="stage-title">
      <h2 id="stageName">未选择文件夹</h2>
      <p id="stageSub">在左侧添加或选择一个文件夹</p>
    </div>
    <div class="stage-tools">
      <span class="pill" id="countPill">0 张</span>
      <button class="ghost-btn" id="refreshBtn" title="立即刷新">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4.5V10h-5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="masonry" id="masonry"></div>

  <div class="empty" id="empty">
    <div class="empty-art">
      <svg viewBox="0 0 120 92" fill="none">
        <rect x="14" y="18" width="44" height="34" rx="7" stroke="currentColor" stroke-width="1.7" opacity=".55"/>
        <rect x="40" y="34" width="52" height="40" rx="8" stroke="currentColor" stroke-width="1.7"/>
        <circle cx="58" cy="49" r="4.4" stroke="currentColor" stroke-width="1.7"/>
        <path d="M42 66l13-11 9 7 8-6 14 12" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
    </div>
    <p>这里还没有图片</p>
    <span>选一个文件夹，或展开它的子文件夹看看</span>
  </div>
</main>

<!-- ============ 弹窗 ============ -->
<div class="mask" id="mask">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-photo">
      <img id="mImg" alt="">
      <button class="nav-btn prev" id="mPrev" title="上一张">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-btn next" id="mNext" title="下一张">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="modal-side">
      <div class="modal-top">
        <h3 id="mName">—</h3>
        <button class="close-btn" id="mClose" title="关闭">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <dl class="meta-list">
        <div class="meta-row">
          <dt>创建日期</dt><dd id="mDate">—</dd>
        </div>
        <div class="meta-row">
          <dt>分辨率</dt><dd id="mRes">—</dd>
        </div>
        <div class="meta-row">
          <dt>文件大小</dt><dd id="mSize">—</dd>
        </div>
        <div class="meta-row">
          <dt>格式</dt><dd id="mFmt">—</dd>
        </div>
      </dl>

      <div class="gen-block" id="genBlock">
        <div class="gen-row">
          <label for="mModel">模型</label>
          <div class="gen-fields">
            <input class="gen-input" type="text" id="mModel" spellcheck="false" autocomplete="off" placeholder="未检测到">
            <input class="gen-input gen-str" type="number" id="mModelStr" step="0.05" autocomplete="off" title="模型强度">
          </div>
        </div>
        <div class="gen-row" id="loraRow">
          <label>Lora</label>
          <div class="lora-list" id="loraList"></div>
        </div>
      </div>

      <div class="note-block">
        <div class="note-head">
          <label for="mNote">备注</label>
          <span class="note-state" id="mState"></span>
        </div>
        <textarea id="mNote" placeholder="记录这张图的提示词…" spellcheck="false"></textarea>
        <div class="note-foot">
          <span id="mNoteSrc">图片属性 · 关闭弹窗自动保存</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 添加文件夹 ============ -->
<div class="mask pk-mask" id="pickMask">
  <div class="picker" role="dialog" aria-modal="true" aria-label="添加文件夹">
    <header class="pk-head">
      <div class="pk-title">
        <h3>添加文件夹</h3>
        <p>选一个文件夹加进左侧列表，也可以把文件夹直接拖到「添加文件夹」按钮上</p>
      </div>
      <button class="close-btn" id="pkClose" title="关闭">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="pk-bar">
      <svg class="pk-bar-ico" viewBox="0 0 24 24" fill="none"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.1c.5 0 1 .2 1.4.6L11.4 7H18a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19H5.5A2.5 2.5 0 0 1 3 16.5v-9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <input type="text" id="pkInput" spellcheck="false" autocomplete="off" placeholder="输入完整路径后回车，例如 D:\Photos\2026">
      <button class="pk-go" id="pkGo" type="button">前往</button>
    </div>

    <div class="pk-crumbs" id="pkCrumbs"></div>
    <div class="pk-quick" id="pkQuick"></div>

    <div class="pk-body">
      <aside class="pk-side" id="pkSide"></aside>
      <div class="pk-main">
        <div class="pk-list" id="pkList"></div>
        <div class="pk-note" id="pkNote"></div>
      </div>
    </div>

    <footer class="pk-foot">
      <div class="pk-sel">
        <span class="pk-sel-label">将添加</span>
        <span class="pk-sel-path" id="pkSelPath">—</span>
      </div>
      <div class="pk-actions">
        <button class="pk-cancel" id="pkCancel" type="button">取消</button>
        <button class="pk-ok" id="pkOk" type="button">添加此文件夹</button>
      </div>
    </footer>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
